# MTF 策略云端运行 — 每 5 分钟触发一次
# 公开仓库（无限免费分钟）→ PAT checkout 私有仓库代码 → 运行 → runner 销毁
#
# 需在公开仓库 Settings → Secrets 配置：
#   PAT_TOKEN         Fine-grained PAT（仅私有仓库 Contents:read）
#   PRIVATE_REPO      私有仓库全名，如 username/mtf-strategy
#   OKX_API_KEY       OKX 模拟盘 API Key
#   OKX_SECRET_KEY    OKX 模拟盘 Secret
#   OKX_PASSPHRASE    OKX 模拟盘 Passphrase
#   TURSO_URL         Turso 数据库地址 (libsql://xxx.turso.io)
#   TURSO_TOKEN       Turso 访问令牌
#   WXPUSHER_SPT      (可选) WxPusher 简单推送 token，配置后开仓/平仓/错误会推送到微信
#
# workflow_dispatch 可手动触发验证全链路。

name: MTF Strategy Runner

on:
  schedule:
    # 每 5 分钟运行一次（GitHub cron 实际可能有 5-15 分钟延迟，属正常）
    - cron: '*/5 * * * *'
  workflow_dispatch:   # 手动触发（测试用）
    inputs:
      dry_run:
        description: '只算信号不下单'
        required: false
        type: boolean
        default: false
      reset_strategy:
        description: '重置策略（清空 state+trades，如 ETH-USDT）'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mtf-strategy-run
  cancel-in-progress: false

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 公开仓库（workflow 本身）
        uses: actions/checkout@v4

      - name: Checkout 私有策略仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PAT_TOKEN }}
          path: strategy

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: strategy/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r strategy/requirements.txt

      - name: 运行策略
        working-directory: strategy
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
          OKX_DEMO_MODE: '1'
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: |
          echo "=== 策略运行开始 $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="
          RESET="${{ github.event.inputs.reset_strategy }}"
          if [ -n "$RESET" ]; then
            echo "重置策略: $RESET"
            python strategy_step.py --reset "$RESET"
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python strategy_step.py --dry-run
          else
            python strategy_step.py
          fi
          echo "=== 策略运行结束 $(date -u '+%Y-%m-%d %H:%M:%S UTC') ==="

      - name: 清理（确保代码不残留）
        if: always()
        run: rm -rf strategy
